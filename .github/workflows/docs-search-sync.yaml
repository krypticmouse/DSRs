name: Docs Search Sync

# Re-ingest the repository into the Mixedbread stores on every merge to
# main. Sync is incremental (sha256-keyed), so unchanged files are skipped.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    name: Sync docs to Mixedbread store
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mixedbread
      - run: python3 docs/scripts/search_docs.py sync
        env:
          MXBAI_API_KEY: ${{ secrets.MXBAI_API_KEY }}
