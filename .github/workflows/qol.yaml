name: Lint and Test

on: [push, pull_request]

env:
  RUSTUP_TOOLCHAIN: "1.94.0"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - run: cargo build --locked --workspace

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - run: cargo test --locked --workspace --all-features

  test-msrv:
    name: Test (Rust 1.90.0)
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.90.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - run: cargo test --locked --workspace --all-features
      - run: cargo check --locked -p dspy-rs --no-default-features

  miri-test:
    name: MIRI Test
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "nightly-2026-01-25"
      MIRIFLAGS: -Zmiri-disable-isolation
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: miri
      - run: cargo miri setup
      - run: cargo miri test --locked --workspace --all-features

  clippy:
    name: Clippy Lint
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets --all-features
