[package]
name = "dsrs-tools"
authors = ["Herumb Shandilya <herumb@stanford.edu>"]
version = "0.1.0"
edition = "2024"
description = "Sandboxed tool-execution runtime for DSRs: Tier-1 in-process QuickJS ephemeral tools."
repository = "https://github.com/krypticmouse/DSRs"
license = "Apache-2.0"

[dependencies]
rquickjs = { version = "0.12.2", features = ["parallel"] }
rig-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "macros", "time"] }
async-trait = { workspace = true }
thiserror = { workspace = true }
blake3 = "1.8.6"
futures = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
