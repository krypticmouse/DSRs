[package]
name = "dspy-rs"
authors = ["Herumb Shandilya <herumb@stanford.edu>"]
version = "0.7.3"
edition = "2024"
description = "A DSPy rewrite(not port) to Rust."
readme = "../../README.md"
documentation = "https://dsrs.herumbshandilya.com"
homepage = "https://dsrs.herumbshandilya.com"
repository = "https://github.com/krypticmouse/DSRs"
license = "Apache-2.0"
exclude = [
    "docs/*",
]

[dependencies]
futures = { workspace = true }
indexmap = { version = "2.10.0", features = ["serde"] }
rayon = "1.10.0"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
bon = "3.7.0"
# Keep this direct pin in sync with workspace [patch.crates-io] for self-sufficient external path consumers.
facet = { version = "0.43", default-features = false, features = ["std", "doc"] }
thiserror = { workspace = true }
dsrs_macros = { version = "0.7.2", path = "../dsrs-macros" }
# Shared .dsrs lexer/structural grammar (also what include_program! validates with).
dsrs-syntax = { workspace = true }
csv = { version = "1.3.1" }
hf-hub = { version = "0.4.3", features = ["tokio"] }
parquet = { version = "56.1.0" }
arrow = { version = "56.1.0" }
regex = "1.11.2"
reqwest = { workspace = true, features = ["blocking"] }
rand = "0.8.5"
foyer = { version = "0.20.0", features = ["serde"]}
# Runtime dep (not dev-only): utils/cache.rs owns a TempDir for the disk cache tier.
tempfile = { workspace = true }
rig-core = { workspace = true }
enum_dispatch = "0.3.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
minijinja = { workspace = true, features = ["builtins", "serde", "debug"] }
# IR graph core (RFC 0002 §2): entity arenas + the sandboxed hole executor.
cranelift-entity = { version = "0.134", features = ["enable-serde"], optional = true }
dsrs-tools = { version = "0.1.0", path = "../dsrs-tools", optional = true }

[package.metadata.cargo-machete]
ignored = ["rig-core"]

[features]
# RFC 0002 IR-3: the graph core + interpreter ship behind the `ir` feature
# (default-on) until the text format stage stabilizes the surface.
default = ["ir", "code-mode"]
ir = ["dep:cranelift-entity", "dep:dsrs-tools"]
# Code Mode (vision report §5.5): collapse a tool set into one sandboxed
# `run_js` tool. Default-on costs nothing extra (`ir` already pulls
# dsrs-tools); build with --no-default-features for the dep-light library.
code-mode = ["dep:dsrs-tools"]

[dev-dependencies]
rstest = "0.25.0"
temp-env = { version = "0.3.6", features = ["async_closure"] }
