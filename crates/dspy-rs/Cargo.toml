[package]
name = "dspy-rs"
authors = ["Herumb Shandilya <herumb@stanford.edu>"]
version = "0.7.3"
edition = "2024"
description = "A DSPy rewrite(not port) to Rust."
readme = "../../README.md"
documentation = "https://dsrs.herumbshandilya.com"
homepage = "https://dsrs.herumbshandilya.com"
repository = "https://github.com/krypticmouse/DSRs"
license = "Apache-2.0"
exclude = [
    "docs/*",
]

[dependencies]
futures = { workspace = true }
indexmap = { version = "2.10.0", features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1.0.4"
tokio = { workspace = true, features = ["full"] }
async-trait = { workspace = true }
anyhow = { workspace = true }
bon = "3.7.0"
# Upstream crates.io facet (the reflection-walker fork pin was removed in phase 3).
facet = { version = "0.43", default-features = false, features = ["std", "doc"] }
thiserror = { workspace = true }
dsrs_macros = { version = "0.7.2", path = "../dsrs-macros" }
# Shared .dsrs lexer/structural grammar (also what include_program! validates with).
dsrs-syntax = { workspace = true }
# Heavy dataset-ingestion stack, gated behind the `data` feature (default-on).
csv = { version = "1.3.1", optional = true }
hf-hub = { version = "0.4.3", features = ["tokio"], optional = true }
parquet = { version = "56.1.0", optional = true }
arrow = { version = "56.1.0", optional = true }
regex = "1.11.2"
reqwest = { workspace = true, features = ["blocking"] }
rand = "0.8.5"
foyer = { version = "0.20.0", features = ["serde"], optional = true }
# The optional disk cache owns a TempDir; tests also use tempfile below.
tempfile = { workspace = true, optional = true }
rig-core = { workspace = true }
enum_dispatch = "0.3.13"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt"] }
minijinja = { workspace = true, features = ["builtins", "serde", "debug", "fuel", "unstable_machinery"] }
# IR graph core (RFC 0002 §2): entity arenas + the sandboxed hole executor.
# Unconditional since phase 2β: Predict runs through the IR Interpreter, so
# the graph core (and Code Mode via dsrs-tools) is load-bearing, not optional.
cranelift-entity = { version = "0.134", features = ["enable-serde"] }
dsrs-tools = { version = "0.1.0", path = "../dsrs-tools" }

[package.metadata.cargo-machete]
ignored = ["rig-core"]

[features]
default = ["data", "cache"]
# CSV/Parquet/HuggingFace dataset ingestion (the arrow stack). JSON/JSONL
# loading is always available. Build with --no-default-features for a
# meaningfully lighter dependency tree.
data = ["dep:arrow", "dep:parquet", "dep:hf-hub", "dep:csv"]
# Optional response-cache storage; execution history is always available.
cache = ["dep:foyer", "dep:tempfile"]

[[example]]
name = "03-evaluate-hotpotqa"
required-features = ["data"]

[[example]]
name = "04-optimize-hotpotqa"
required-features = ["data"]

[[example]]
name = "08-optimize-mipro"
required-features = ["data"]

[[example]]
name = "97-perf-microbench"
required-features = ["cache"]

[dev-dependencies]
tempfile = { workspace = true }
rstest = "0.25.0"
temp-env = { version = "0.3.6", features = ["async_closure"] }
