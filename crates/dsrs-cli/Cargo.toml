[package]
name = "dsrs-cli"
version = "0.1.0"
edition = "2024"
authors = ["Herumb Shandilya <herumb@stanford.edu>"]
description = "The dsrs command line: check, format, and serve .dsrs program artifacts"
readme = "../../README.md"
documentation = "https://dsrs.herumbshandilya.com"
homepage = "https://dsrs.herumbshandilya.com"
repository = "https://github.com/krypticmouse/DSRs"
license = "Apache-2.0"

[[bin]]
name = "dsrs"
path = "src/main.rs"

[dependencies]
dspy-rs = { workspace = true }
dsrs-tools = { workspace = true }
anyhow = { workspace = true }
axum = "0.8"
clap = { version = "4", features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net"] }

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
# Same pin as dspy-rs: needed to construct canned AssistantContent responses
# for the TestCompletionModel in server integration tests.
rig-core = { workspace = true }
tempfile = { workspace = true }
